{% extends "base.html" %}
{% block title %}Add site — Webify{% endblock %}
{% block content %}
<div class="topbar">
  <h1>Add a site</h1>
</div>
<div class="card" style="max-width:560px">
  <div class="card-header"><h3>Import from Git</h3></div>
  <div class="card-body">
    {% if error %}
    <div style="background:rgba(220,53,69,.1);border:1px solid rgba(220,53,69,.2);border-radius:6px;padding:12px 16px;color:#ff6b7a;font-size:13px;margin-bottom:16px">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label>Site name</label>
        <input type="text" name="name" placeholder="my-site" required pattern="[a-zA-Z0-9_-]+" autofocus>
        <div class="hint">Letters, numbers, dash, underscore only.</div>
      </div>
      <div class="form-group">
        <label>Repository URL</label>
        <input type="url" name="repo" placeholder="https://github.com/user/repo.git" required>
        <div class="hint">Public git repository URL.</div>
      </div>
      <div class="form-group">
        <label>Mode</label>
        <select name="mode">
          <option value="local">Local — localhost only</option>
          <option value="cloudflared">Cloudflared — public URL via Cloudflare</option>
          <option value="nginx">Nginx — reverse proxy (requires root)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Port (optional)</label>
        <input type="number" name="port" placeholder="Auto (starts at 7070)" min="1024" max="65535">
        <div class="hint">Leave empty to auto-assign starting at 7070.</div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button type="submit" class="btn btn-primary">Create site</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
